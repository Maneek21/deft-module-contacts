name: Validate Deft module

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      deft_ref:
        description: Full Deft commit SHA containing the validator to use
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: contacts-module-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-check:
    name: Authoritative manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve validator revision
        env:
          DEFT_VALIDATOR_REF: ${{ inputs.deft_ref || vars.DEFT_VALIDATOR_REF || 'd9c1530dec444ac7bc863168b472f12e68cfef6f' }}
        run: |
          if ! printf '%s' "$DEFT_VALIDATOR_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'The Deft validator revision must be a full 40-character commit SHA.' >&2
            exit 1
          fi

      - name: Check out Contacts module
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: module

      - name: Check out pinned Deft validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.DEFT_VALIDATOR_REPOSITORY || 'Maneek21/Deft' }}
          ref: ${{ inputs.deft_ref || vars.DEFT_VALIDATOR_REF || 'd9c1530dec444ac7bc863168b472f12e68cfef6f' }}
          path: deft
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Use pnpm 11
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.10.0

      - name: Install the pinned validator
        working-directory: deft
        run: |
          pnpm install --frozen-lockfile

      - name: Validate manifest and expected digest
        working-directory: module
        run: ./scripts/validate.sh ../deft
